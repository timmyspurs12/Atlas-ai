version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns: ["expo*", "@expo/*", "react-native*"]
      nest:
        patterns: ["@nestjs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
