user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  log_format atlas_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout atlas_json;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream atlas_api {
    server api:4000;
    keepalive 64;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
      proxy_pass http://atlas_api/v1/health/live;
      proxy_set_header X-Request-ID $request_id;
      access_log off;
    }

    location /socket.io/ {
      proxy_pass http://atlas_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      limit_conn connections_per_ip 20;
    }

    location / {
      limit_req zone=api_per_ip burst=60 nodelay;
      limit_conn connections_per_ip 30;
      proxy_pass http://atlas_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
