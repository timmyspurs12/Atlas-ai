name: atlas-ai

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
    ports:
      - '5432:5432'
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - atlas_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://atlas:atlas_dev_only@postgres:5432/atlas?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-only-access-secret-change-before-production-2026
      REFRESH_TOKEN_PEPPER: local-only-refresh-pepper-change-before-production-2026
      FIELD_ENCRYPTION_KEY: local-only-field-encryption-key-change-before-production
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006,http://localhost:8080
      APP_WEB_URL: http://localhost:8080
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
    command: ['sh', '-c', 'npm exec -- prisma migrate deploy && node dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4000/v1/health/live'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  atlas_postgres:
  atlas_redis:
